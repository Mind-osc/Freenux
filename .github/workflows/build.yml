name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Εργαλεία
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Λήψη proot από Termux
        run: bash scripts/fetch-proot.sh

      - name: Κλειδί υπογραφής
        env:
          FREENUX_KEY_PASSWORD: ${{ secrets.FREENUX_KEY_PASSWORD }}
        run: |
          if [ -z "$FREENUX_KEY_PASSWORD" ]; then
            echo "::error::Λείπει το secret FREENUX_KEY_PASSWORD (Settings → Secrets and variables → Actions)"; exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/freenux.keystore.enc -out app/freenux.keystore -pass env:FREENUX_KEY_PASSWORD

      - name: Build
        env:
          FREENUX_KEY_PASSWORD: ${{ secrets.FREENUX_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Freenux-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Δημοσίευση APK (σταθερός σύνδεσμος)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Freenux.apk
          gh release delete latest -y --cleanup-tag || true
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          printf '\n---\nBuild `%s` · [Όλες οι αλλαγές](https://github.com/%s/blob/main/CHANGELOG.md)\n' "${GITHUB_SHA::7}" "$GITHUB_REPOSITORY" >> notes.md
          gh release create latest Freenux.apk --title "Freenux $VER" --notes-file notes.md --latest
